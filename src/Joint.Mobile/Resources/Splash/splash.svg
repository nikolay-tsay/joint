<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The logo as a gradient badge. Android only allows a single flat color behind the
     splash, so the gradient lives in the badge. It stays inside the middle two thirds,
     the part Android keeps when it masks the splash icon to a circle. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6D28D9" />
            <stop offset="0.55" stop-color="#DB2777" />
            <stop offset="1" stop-color="#F97316" />
        </linearGradient>
    </defs>
    <circle cx="228" cy="228" r="148" fill="url(#brand)" />
    <circle cx="198" cy="228" r="48" fill="none" stroke="#FFFFFF" stroke-width="16" />
    <circle cx="258" cy="228" r="48" fill="none" stroke="#FFFFFF" stroke-width="16" />
</svg>
